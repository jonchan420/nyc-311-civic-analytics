name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # same pinned runner and Python as the monthly refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # unit, oracle, security, eval-threshold, MCP, and Streamlit page tests;
      # no network calls and no API key
      - name: Run the tests
        run: pytest -q
