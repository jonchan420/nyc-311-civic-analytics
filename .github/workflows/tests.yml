name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # same pinned runner and Python as the monthly refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # unit, oracle, security, eval-threshold, MCP, BigQuery (mocked), and Streamlit page tests;
      # no network calls and no API key
      - name: Run the tests
        run: pytest -q

  docker:
    # build the Streamlit image and check it starts; nothing is pushed anywhere
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t nyc-311-civic-analytics:ci .

      - name: Check the app starts and answers its health check
        run: |
          docker run -d --name app -p 8080:8080 nyc-311-civic-analytics:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/_stcore/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/_stcore/health
          docker image ls nyc-311-civic-analytics:ci
          docker rm -f app
