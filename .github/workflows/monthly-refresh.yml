name: Monthly refresh

# Runs on the 5th so the previous month is fully published on NYC Open Data
# (the API lags 1-2 days). refresh_live.py refuses to run if it isn't.
on:
  schedule:
    - cron: "0 15 5 * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # only used by the optional BigQuery sync below

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # pinned rather than ubuntu-latest so an image migration can't change
    # the Python build or system libraries between monthly runs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh monthly counts from the NYC Open Data API
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python src/refresh_live.py

      - name: List complaint labels missing from the category catalog
        run: python src/build_category_catalog.py --check

      - name: Score existing frozen forecasts
        run: python src/score_forecasts.py

      - name: Retrain and freeze next forecasts
        run: |
          python src/build_forecast_dataset.py
          python src/train_evaluate.py
          python src/forecast_2026.py
          python src/forecast_seasonal_naive.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/forecasts
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            month=$(python -c "import json; print(json.load(open('data/live/metadata.json'))['complete_through'])")
            frozen=$(git diff --cached --name-only --diff-filter=A -- 'data/forecasts/forecast_*.csv' | wc -l | tr -d ' ')
            if [ "$frozen" -gt 0 ]; then
              git commit -m "Monthly refresh: actuals through ${month}, ${frozen} new frozen forecasts"
            else
              git commit -m "Monthly refresh: actuals through ${month}"
            fi
            git push
          fi

      # Optional: reload the BigQuery copy (sandbox tables expire after 60 days). Runs only when
      # the GCP secrets are set, and authenticates with Workload Identity Federation, no key file.
      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        if: env.GCP_PROJECT_ID != '' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Load data/live into BigQuery
        if: env.GCP_PROJECT_ID != '' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        run: |
          pip install -r requirements-cloud.txt
          python src/sync_bigquery.py
